/*
 * ── Google Form integration ──
 * 1. Create a Google Form with ONE short-answer or paragraph question
 * 2. Click the three-dot menu → "Get pre-filled link"
 * 3. Type anything in the field, click "Get link"
 * 4. The URL will contain something like: entry.1234567890=YourText
 * 5. Copy the form ID and entry ID below:
 */
const GOOGLE_FORM_ID   = "1FAIpQLSeE86FxCPWoAllmMZw09mr6SyaAUqNaNmrNwPj6_EWaPonVWQ";
const GOOGLE_ENTRY_ID  = "entry.1020613846";

function submitSuggestion() {
  const textEl = document.getElementById("suggest-text");
  const text = textEl.value.trim();
  if (!text) return;

  const confirmEl = document.getElementById("suggest-confirm");
  const errorEl = document.getElementById("suggest-error");

  if (GOOGLE_FORM_ID === "YOUR_FORM_ID_HERE") {
    // Config not set — fall back to opening a mailto link
    window.open("mailto:?subject=Muzan+Archive+Suggestion&body=" + encodeURIComponent(text));
    textEl.value = "";
    confirmEl.style.display = "block";
    if (errorEl) errorEl.style.display = "none";
    setTimeout(() => { confirmEl.style.display = "none"; }, 4000);
    return;
  }

  const url = `https://docs.google.com/forms/d/e/${GOOGLE_FORM_ID}/formResponse`;
  const formData = new FormData();
  formData.append(GOOGLE_ENTRY_ID, text);

  fetch(url, { method: "POST", mode: "no-cors", body: formData })
    .then(() => {
      textEl.value = "";
      confirmEl.style.display = "block";
      if (errorEl) errorEl.style.display = "none";
      setTimeout(() => { confirmEl.style.display = "none"; }, 4000);
    })
    .catch(() => {
      // Fallback: open the form pre-filled in a new tab
      const fallback = `https://docs.google.com/forms/d/e/${GOOGLE_FORM_ID}/viewform?usp=pp_url&${GOOGLE_ENTRY_ID}=${encodeURIComponent(text)}`;
      window.open(fallback, "_blank");
      textEl.value = "";
    });
}

/* ══════════════════════════════════════════
   FILTERS
   ══════════════════════════════════════════ */

let activeFilters = new Set();

function buildFilterButtons() {
  const labels = t("typeLabels");
  const container = document.getElementById("filter-btns");
  container.innerHTML = "";
  Object.keys(labels).forEach(type => {
    const btn = document.createElement("button");
    btn.className = activeFilters.has(type) ? `pill active-${type}` : "pill";
    btn.dataset.type = type;
    btn.textContent = labels[type];
    btn.onclick = () => {
      if (activeFilters.has(type)) {
        activeFilters.delete(type);
      } else {
        activeFilters.add(type);
      }
      buildFilterButtons();
      render();
    };
    container.appendChild(btn);
  });
}

  document.getElementById("header-subname").textContent = t("headerSubname");
  document.getElementById("header-dates").textContent = t("dates");

  // Meta row
  document.getElementById("header-meta").innerHTML = `

/* ══════════════════════════════════════════
   RENDER LIST
   ══════════════════════════════════════════ */

function render() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  let items = ITEMS.slice();

  if (activeFilters.size) {
    items = items.filter(i => activeFilters.has(i.type));
  }

  if (q) {
    items = items.filter(i =>
      (i.titleEn || "").toLowerCase().includes(q) ||
      (i.titleAr || "").toLowerCase().includes(q) ||
      (i.descEn || "").toLowerCase().includes(q) ||
      (i.descAr || "").toLowerCase().includes(q) ||
      (i.outlet || "").toLowerCase().includes(q) ||
      (i.outletEn || "").toLowerCase().includes(q) ||
      String(i.year).includes(q)
    );
  }

  items.sort((a, b) => b.year - a.year || (b.month || "").localeCompare(a.month || ""));

  const isAr = currentLang === "ar";
  const labels = t("typeLabels");
  const badges = t("sourceBadge");

  const countEl = document.getElementById("count-line");
  countEl.textContent = `${items.length} ${t("resultsSuffix")}`;

  const list = document.getElementById("list");

  if (!items.length) {
    list.innerHTML = `<div class="no-results">${t("noResults")}</div>`;
    return;
  }

  let html = "";
  let lastYear = null;

  items.forEach(item => {
    if (item.year !== lastYear) {
      if (lastYear !== null) html += "</div>";
      html += `<div class="year-group"><div class="year-heading">${item.year}</div>`;
      lastYear = item.year;
    }

    const displayTitle = isAr ? (item.titleAr || item.titleEn) : (item.titleEn || item.titleAr);
    const altTitle = isAr ? item.titleEn : item.titleAr;
    const desc = isAr ? (item.descAr || item.descEn) : (item.descEn || item.descAr);
    const collab = isAr ? (item.collabAr || "") : (item.collabEn || "");
    const outletName = (!isAr && item.outletEn) ? item.outletEn : item.outlet;

    const titleEl = item.url
      ? `<a class="item-title" href="${item.url}" target="_blank" rel="noopener">${displayTitle}</a>`
      : `<span class="item-title no-link">${displayTitle}</span>`;

    // Show alt-language title only if it differs meaningfully
    const showAltTitle = altTitle && altTitle !== displayTitle;
    const altTitleEl = showAltTitle
      ? `<div class="item-en-title" ${isAr ? '' : 'dir="rtl" style="font-family:var(--font-ar);font-style:normal;"'}>${altTitle}</div>`
      : "";

    const monthStr = item.month
      ? (isAr ? `${item.month} ${item.year}` : `${MONTHS_EN[item.month] || item.month} ${item.year}`)
      : String(item.year);

    const srcBadge = badges[item.sourceLang];

    html += `
      <div class="item">
        <div class="item-top">
          ${titleEl}
          <span class="source-lang-badge">${srcBadge}</span>
          <span class="tag tag-${item.type}">${labels[item.type]}</span>
        </div>
        ${altTitleEl}
        <div class="item-meta">
          <span class="outlet">${outletName}</span>
          <span>${monthStr}</span>
        </div>
        ${desc ? `<div class="item-desc">${desc}</div>` : ""}
        ${collab ? `<div class="item-collab">${collab}</div>` : ""}
      </div>`;
  });

  if (lastYear !== null) html += "</div>";
  list.innerHTML = html;
}
